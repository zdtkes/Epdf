<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>土庫國小 3D 電子書閱讀器</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
</head>
<body>

  <!-- 頂部列 -->
  <header class="reader-header">
    <div class="brand">📖 雙週報電子書</div>
    <div class="header-controls">
      <select id="gdrive-select">
        <option value="">☁️ 載入雲端書庫中...</option>
      </select>
      <button id="btn-toggle-upload" class="icon-btn" title="開啟/收合上傳區">📁 上傳區</button>
      <button id="btn-fullscreen" class="icon-btn" title="全螢幕 (F)">⛶ 全螢幕</button>
    </div>
  </header>

  <!-- 上傳與連結區塊 -->
  <div id="dropzone-section" class="dropzone-box">
    <div class="dropzone" id="dropzone">
      <div class="dropzone-icon">📚</div>
      <h2>將 PDF 檔案拖曳至此處</h2>
      <p>或貼上 Google Drive 分享連結（檔案或資料夾）</p>

      <div class="url-input-container">
        <input type="text" id="gdrive-url-input" placeholder="貼上 Google Drive 連結..." />
        <button id="btn-load-url" class="btn-secondary">讀取連結</button>
      </div>

      <div class="divider"><span>或</span></div>

      <label class="btn-primary">
        選擇本機 PDF 檔案
        <input type="file" id="file-input" accept="application/pdf" hidden>
      </label>
    </div>
  </div>

  <!-- 閱讀主區域 -->
  <main class="flipbook-viewport">
    <div id="flipbook"></div>
    <div id="loading-overlay" style="display: none;">
      <div class="spinner"></div>
      <div id="loading-text">⚡ 正在生成 3D 電子書...</div>
    </div>
  </main>

  <!-- 底部控制列 -->
  <footer class="reader-footer">
    <button id="btn-prev" class="nav-btn" title="上一頁 (←)">◀</button>

    <div class="progress-container">
      <span id="page-num">1 / 1</span>
      <input type="range" id="page-slider" min="1" max="1" value="1">
    </div>

    <button id="btn-next" class="nav-btn" title="下一頁 (→)">▶</button>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
