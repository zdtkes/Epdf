<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 Flipbook 電子書</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="toolbar">
    <div class="music-controls">
      <label for="music-select">🎵 背景輕音樂：</label>
      <select id="music-select">
        <option value="DWcjZJyZu4U">純鋼琴輕音樂</option>
        <option value="jfKfPfyJRdk">Lofi Chillout 爵士</option>
        <option value="2OEL4P1rlo0">舒緩自然聲</option>
      </select>
      <button id="btn-toggle-music">▶ 播放音樂</button>
    </div>
  </header>

  <main class="book-container">
    <div id="flipbook"></div>
  </main>

  <div id="youtube-player" style="display:none;"></div>

  <!-- CDN 函式庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  
  <!-- 注意：先載入 app.js，再載入 YouTube API -->
  <script src="js/app.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
