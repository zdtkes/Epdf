<div class="dropzone" id="dropzone">
  <div class="dropzone-icon">📚</div>
  <h2>將 PDF 檔案拖曳至此處</h2>
  <p>或選擇以下方式開啟電子書</p>

  <!-- === 新增：Google Drive 連結輸入區 === -->
  <div class="url-input-container">
    <input 
      type="text" 
      id="gdrive-url-input" 
      placeholder="https://drive.google.com/drive/folders/1kOjZbSDMHDtWzCaYJ7PXdha7WI6iyUlb" 
    />
    <button id="btn-load-url" class="btn-secondary">讀取連結</button>
  </div>

  <div class="divider"><span>或</span></div>

  <!-- 原本的本地選擇檔案按鈕 -->
  <label class="btn-primary">
    選擇本機 PDF 檔案
    <input type="file" id="file-input" accept="application/pdf" hidden>
  </label>
</div>
