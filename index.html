<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 Flipbook 電子書</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="toolbar">
    <div class="left-controls">
      <!-- 手動上傳 -->
      <label for="pdf-upload" class="upload-btn">📁 本地上傳</label>
      <input type="file" id="pdf-upload" accept="application/pdf">

      <!-- Google Drive 雲端選單 -->
      <label for="gdrive-select">☁️ 雲端書庫：</label>
      <select id="gdrive-select">
        <option value="">雲端書單讀取中...</option>
      </select>
    </div>

    <div class="music-controls">
      <label for="music-select">🎵 背景輕音樂：</label>
      <select id="music-select">
        <option value="./audio/piano.mp3">舒緩鋼琴曲</option>
        <option value="./audio/jazz.mp3">Lofi 閱讀爵士</option>
        <option value="./audio/miyazaki.mp3">宮崎駿風格鋼琴輕音樂</option>
      </select>
      <button id="btn-toggle-music">▶ 播放音樂</button>
    </div>
  </header>

  <main class="book-container">
    <div id="loading-tip" style="display:none;">📄 電子書準備中...</div>
    <div id="flipbook"></div>
  </main>

  <audio id="bg-audio" loop src="./audio/piano.mp3"></audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
